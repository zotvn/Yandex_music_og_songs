# Пример настроек. Сейчас CLI использует дефолты из кода (AppConfig),
# этот файл пока не подхватывается автоматически — ориентир для будущей загрузки.

token_env: YANDEX_MUSIC_TOKEN

playlists:
  mode: all          # all | selected | exclude  (задел; CLI пока берёт KIND из аргумента)
  kinds: []
  exclude_kinds: []

detection:
  fake_version_patterns:
    - radio\s*edit
    - cover
    - karaoke
    - tribute
    - instrumental
    - sped\s*up
    - slowed
    - nightcore
    - \b8d\b
  keep_version_patterns:
    - remix
    - acoustic
    - from the series
    - soundtrack
    - \bost\b
  title_suffix_patterns:
    - '\(cover\)'
    - '\(radio edit\)'
    - '\[karaoke\]'
  # В коде по умолчанию false; true — все user uploads считаются FAKE
  treat_ugc_as_fake: false
  treat_replaced_to_ugc: true

# Задел: автозамена треков в плейлисте ещё не реализована
